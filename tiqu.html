<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提取专家 Ultra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --accent:#007aff;
  --bg:#f2f2f7;
  --card:#ffffff;
  --danger:#ff3b30;
  --success:#34c759;
  --warning:#ffcc00;
  --text-dark:#333;
  --text-light:#777;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
body{background:var(--bg);height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;}
.app{
  width:100%;
  max-width:500px; /* 桌面显示最大宽度 */
  height:100vh;
  margin:0 auto; /* 居中 */
  background: var(--card);
  border-radius:0;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,0.1);
}
header{padding:15px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;}
header h1{font-size:24px;font-weight:900;color:var(--text-dark);}
header .btn{padding:6px 12px;border-radius:12px;font-size:14px;cursor:pointer;border:none;transition:0.2s;}
header .btn:active{transform:scale(0.95);}
header .btn-danger{background:var(--danger);color:#fff;}
header .btn-success{background:var(--success);color:#fff;}
.stats{display:flex;gap:8px;margin:5px 15px 10px 15px;justify-content:center;}
.pill{flex:1;background:#f5f5f5;padding:8px 12px;border-radius:20px;font-size:14px;font-weight:600;color:var(--text-dark);position:relative;box-shadow:0 3px 6px rgba(0,0,0,0.05);cursor:pointer;overflow:hidden;}
.pill b{color:var(--accent);}
.pill .bar{position:absolute;bottom:0;left:0;height:100%;background:var(--accent);width:0%;opacity:0.2;transition:width 0.6s ease;}
.container{flex:1;display:flex;flex-direction:column;background:var(--card);overflow:hidden;}
.view{display:flex;flex-direction:column;height:100%;flex:1;}
.view:not(.active){display:none;}
textarea{flex:1;border:none;padding:15px;font-size:18px;resize:none;outline:none;line-height:1.6;background:#f9f9fb;border-radius:0;box-shadow:none;}
.list{flex:1;overflow-y:auto;padding:0;-webkit-overflow-scrolling:touch;}
.row{padding:12px;background:#f9f9fb;border-bottom:1px solid #eee;display:flex;justify-content:flex-start;align-items:center;transition:0.2s;cursor:pointer;position:relative;}
.row:hover{background:#f0f0f0;}
.row.dup{background:#fff9f0;border-left:4px solid #ffcc00;}
.row.outlier{background:#ffe6e6;border-left:4px solid #ff3b30;}
.row.unique{border-left:4px solid var(--success);}
.row .badge{background:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#333;box-shadow:0 2px 6px rgba(0,0,0,0.15);margin-left:auto;margin-right:10px;}
.row .status{position:absolute;right:60px;top:50%;transform:translateY(-50%);font-size:14px;color:#555;font-weight:600;opacity:0.4;pointer-events:none;}
.tray{display:flex;gap:10px;padding:12px;background:rgba(255,255,255,0.95);border-top:1px solid #ddd;}
.btn-main{flex:1;padding:14px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;transition:0.2s;box-shadow:0 6px 18px rgba(0,0,0,0.1);}
.btn-main.btn-p{background:linear-gradient(135deg,#007aff,#0051c7);color:#fff;}
.btn-main.btn-s{background:#e5e5ea;color:#000;}
.btn-main.btn-ok{background:var(--success);color:#fff;}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 24px;border-radius:24px;display:none;z-index:999;font-size:14px;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);display:none;justify-content:center;align-items:center;z-index:1000;}
.modal .content{background:#fff;padding:20px;border-radius:16px;width:80%;max-width:360px;box-shadow:0 10px 25px rgba(0,0,0,0.2);display:flex;flex-direction:column;align-items:center;}
.modal .content label{display:block;margin-bottom:5px;color:#555;width:100%;text-align:left;}
.modal .content input{width:100%;margin-bottom:15px;padding:10px;border-radius:10px;border:1px solid #ccc;outline:none;}
.modal .content button{padding:14px 20px;width:60%;border:none;border-radius:16px;background:#007aff;color:#fff;cursor:pointer;transition:0.2s;text-align:center;}
.modal .content button:active{transform:scale(0.95);}
</style>
</head>
<body>

<div id="toast" class="toast">已复制</div>

<div id="settingsModal" class="modal" onclick="closeModal(event,'settingsModal')">
  <div class="content" onclick="event.stopPropagation()">
    <label>最小位数</label>
    <input type="number" id="modalMinLen" value="11">
    <label>占比阈值(%)</label>
    <input type="number" id="modalRatio" value="10">
    <button onclick="applySettings()">确认</button>
  </div>
</div>

<div id="exportModal" class="modal" onclick="closeModal(event,'exportModal')">
  <div class="content" onclick="event.stopPropagation()">
    <label>导出文件名</label>
    <input type="text" id="exportName" value="提取结果">
    <button onclick="confirmExport()">导出</button>
  </div>
</div>

<div class="app">
<header>
  <button class="btn btn-success" onclick="openSettings()">设置</button>
  <h1>提取专家</h1>
  <button class="btn btn-danger" onclick="doReset()">重置</button>
</header>

<div class="stats">
  <div class="pill" onclick="copyUnique()">唯一数: <b id="sUni">0</b><div class="bar" style="width:0%"></div></div>
  <div class="pill" onclick="copyOutliers()">异类: <b id="sOutlier">0</b><div class="bar" style="width:0%"></div></div>
  <div class="pill" onclick="copyDups()">重复项: <b id="sDup">0</b><div class="bar" style="width:0%"></div></div>
</div>

<div class="container">
<div id="v1" class="view active">
<textarea id="tIn" placeholder="请在此粘贴包含数字的文本…"></textarea>
<div class="tray">
<button class="btn-main btn-p" onclick="doExtract()">解析并追加</button>
<button class="btn-main btn-s" id="vBtn" style="display:none" onclick="go(2)">查看库</button>
<button class="btn-main btn-ok" onclick="openExport()">导出</button>
</div>
</div>

<div id="v2" class="view">
<div class="list" id="tList"></div>
<div class="tray">
<button class="btn-main btn-s" onclick="go(1)">返回追加</button>
<button class="btn-main btn-ok" onclick="openExport()">导出</button>
</div>
</div>
</div>

<script>
// JS逻辑保持和之前一致
let db=[], minLen=11, ratioThreshold=0.1, exportData=null;

function doExtract(){
  const val=document.getElementById('tIn').value.trim();
  if(!val && db.length===0) return;
  const raw=val.match(/\d+/g)||[];
  const filtered=raw.filter(n=>n.length>=minLen);
  filtered.forEach(num=>{
    let item=db.find(d=>d.val===num);
    if(item){item.count++; item.status="重复";}
    else{
      const reasons=[];
      if(num.length<minLen) reasons.push("位数不符");
      if(db.length>0){
        const prefix=num.slice(0,2);
        const prefixCount=db.filter(d=>d.val.slice(0,2)===prefix).length;
        if(prefixCount/db.length<ratioThreshold) reasons.push("前缀异常");
      }
      item={val:num,count:1,status:reasons.join(" ")||"符合",isOutlier:reasons.length>0};
      db.push(item);
    }
  });
  document.getElementById('tIn').value="";
  analyzeOutliers();
  render();
  go(2);
}

function analyzeOutliers(){
  const prefixMap={}, lengthMap={};
  db.forEach(d=>{
    const p=d.val.slice(0,2); prefixMap[p]=(prefixMap[p]||0)+1;
    lengthMap[d.val.length]=(lengthMap[d.val.length]||0)+1;
  });
  const total=db.length;
  db.forEach(d=>{
    const p=d.val.slice(0,2);
    const preRatio=prefixMap[p]/total;
    const lenRatio=lengthMap[d.val.length]/total;
    const reasons=[];
    if(preRatio<ratioThreshold) reasons.push("前缀异常");
    if(lenRatio<ratioThreshold) reasons.push("位数不符");
    d.isOutlier=reasons.length>0;
    if(reasons.length>0)d.status=reasons.join(" ");
    else if(d.count>1)d.status="重复";
    else d.status="符合";
  });
}

function render(){
  const listEl=document.getElementById('tList');
  const dups=db.filter(d=>d.count>1);
  const uniques=db.filter(d=>d.count===1&&!d.isOutlier);
  const outliers=db.filter(d=>d.isOutlier);
  document.getElementById('sUni').textContent=uniques.length;
  document.getElementById('sDup').textContent=dups.length;
  document.getElementById('sOutlier').textContent=outliers.length;
  const total=db.length;
  document.querySelectorAll('.pill .bar').forEach((b,i)=>{
    if(total>0){b.style.width=[uniques.length,outliers.length,dups.length][i]/total*100+'%';}else{b.style.width='0%';}
  });
  document.getElementById('vBtn').style.display=db.length>0?'block':'none';
  if(db.length===0){ listEl.innerHTML='<p style="text-align:center;margin-top:50px;color:#8e8e93">库中暂无数据</p>';return;}
  listEl.innerHTML=db.map(i=>{
    let statusText=i.status||"符合";
    return `<div class="row ${i.isOutlier?'outlier':(i.count>1?'dup':'unique')}" onclick="copySingle('${i.val}',${i.count},this)">
      <span style="font-family:monospace;font-weight:600">${i.val}</span>
      <span class="status">${statusText}</span>
      <span class="badge">${i.count}</span>
    </div>`;
  }).join('');
}

function copySingle(v,c,item){
  const row=db.find(d=>d.val===v);
  let s=v;
  if(row.status && row.status!=="符合") s+=` ${row.status}`;
  navigator.clipboard.writeText(s).then(()=>showT(`已复制: ${s}`));
}

function copyUnique(){
  const items=db.filter(d=>d.count===1 && !d.isOutlier);
  if(items.length===0) return;
  const s=items.map(d=>d.val).join("\n");
  navigator.clipboard.writeText(s).then(()=>showT(`已复制 ${items.length} 个唯一项`));
}

function copyDups(){
  const items=db.filter(d=>d.count>1);
  if(items.length===0) return;
  const s=items.map(d=>`${d.val} ${d.status}`).join("\n");
  navigator.clipboard.writeText(s).then(()=>showT(`已复制 ${items.length} 个重复项`));
}

function copyOutliers(){
  const items=db.filter(d=>d.isOutlier);
  if(items.length===0) return;
  const s=items.map(d=>d.val + (d.status?` ${d.status}`:"")).join("\n");
  navigator.clipboard.writeText(s).then(()=>showT(`已复制 ${items.length} 个异类项`));
}

function go(n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('v'+n).classList.add('active');}
function showT(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1200);}
function doReset(){db=[];render();go(1);showT("已重置全部数据");}

function openSettings(){document.getElementById('settingsModal').style.display='flex';document.getElementById('modalMinLen').value=minLen;document.getElementById('modalRatio').value=ratioThreshold*100;}
function applySettings(){minLen=parseInt(document.getElementById('modalMinLen').value);ratioThreshold=parseFloat(document.getElementById('modalRatio').value)/100;document.getElementById('settingsModal').style.display='none';showT("设置已应用");}

function openExport(){document.getElementById('exportModal').style.display='flex';document.getElementById('exportName').value="提取结果";}
function confirmExport(){exportData=document.getElementById('exportName').value||"export";document.getElementById('exportModal').style.display='none';doExport();}
function doExport(){if(db.length===0) return;const validData=db.filter(d=>!d.isOutlier);const fn=exportData||"export";const date=new Date();const mmdd=String(date.getMonth()+1).padStart(2,'0')+String(date.getDate()).padStart(2,'0');const fileName=`${mmdd}-${fn}-${validData.length}单`;const aoa=validData.map(d=>[d.val]);const ws=XLSX.utils.aoa_to_sheet(aoa);const range=XLSX.utils.decode_range(ws['!ref']);for(let R=0;R<=range.e.r;R++){const cell=XLSX.utils.encode_cell({r:R,c:0});if(ws[cell]){ws[cell].t='s';ws[cell].z='@';}}const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Data");XLSX.writeFile(wb,`${fileName}.xlsx`);}

function closeModal(e,id){document.getElementById(id).style.display='none';}
</script>
</body>
</html>
